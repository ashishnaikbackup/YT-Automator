<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YT-Automator</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0f;color:#f5f5f7;font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(760px,92vw);padding:32px;border:1px solid #27272f;border-radius:24px;background:#141419;box-shadow:0 20px 70px #0008}h1{margin:0 0 8px;font-size:32px}p{color:#a7a7b0;margin:0 0 24px}.topic{width:100%;padding:16px;border-radius:14px;border:1px solid #33343d;background:#0d0d12;color:white;font-size:16px}.row{display:flex;gap:10px;margin:12px 0}.duration button{flex:1;padding:12px;border:1px solid #33343d;background:#0d0d12;color:#ddd;border-radius:10px;cursor:pointer}.duration button.active{border-color:#fff;color:#fff}.generate{width:100%;padding:15px;border:0;border-radius:14px;background:#fff;color:#111;font-weight:700;font-size:16px;cursor:pointer;margin-top:8px}.generate:disabled{opacity:.5}.status{margin-top:18px;color:#a7a7b0;white-space:pre-wrap}.result{margin-top:20px}.result video{width:100%;max-height:620px;border-radius:16px;background:#000}.script{margin-top:14px;padding:16px;background:#0d0d12;border-radius:14px;line-height:1.55;color:#ddd;white-space:pre-wrap}.save{color:white}</style></head><body><main class="card"><h1>YT-Automator</h1><p>Ollama → energetic voice → real free visuals → synced captions → MP4. Runs locally on your PC.</p><input id="topic" class="topic" placeholder="e.g. 3 free AI tools for engineering students"><div class="row duration"><button data-d="30">30 sec</button><button data-d="45" class="active">45 sec</button><button data-d="60">60 sec</button></div><button id="go" class="generate">Generate Short</button><div id="status" class="status"></div><div id="result" class="result"></div></main><script>let duration=45;document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{duration=+b.dataset.d;document.querySelectorAll('[data-d]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));document.querySelector('#go').onclick=async()=>{const topic=document.querySelector('#topic').value.trim(),go=document.querySelector('#go'),status=document.querySelector('#status'),result=document.querySelector('#result');if(!topic){status.textContent='Enter a topic first.';return}go.disabled=true;result.innerHTML='';status.textContent='Generating script → voice → visuals → synced captions…';try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,duration})});const d=await r.json();if(!r.ok)throw Error(d.error||'Generation failed');status.textContent=`Short generated successfully. ${d.visual_count} visual(s), ${d.duration}s audio.`;result.innerHTML='<video controls autoplay src="'+d.video_url+'"></video><div class="script">'+esc(d.script)+'</div><p><a class="save" href="'+d.video_url+'" download>Save MP4</a></p>'}catch(e){status.textContent='Error: '+e.message}finally{go.disabled=false}};</script></body></html>
