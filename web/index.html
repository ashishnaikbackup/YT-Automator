<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YT-Automator</title><style>body{font-family:Inter,Arial,sans-serif;background:#f5f5f7;color:#111;max-width:760px;margin:60px auto;padding:24px}main{background:#fff;border-radius:24px;padding:32px;box-shadow:0 8px 30px #0001}textarea{width:100%;min-height:120px;padding:14px;border:1px solid #ddd;border-radius:12px;box-sizing:border-box;font:inherit}button,select{padding:12px 16px;border:0;border-radius:10px;font:inherit}button{cursor:pointer;background:#111;color:#fff}select{border:1px solid #ddd;background:#fff}#status{margin-top:20px;white-space:pre-wrap}video{width:100%;margin-top:20px;border-radius:16px}</style></head>
<body><main><h1>YT-Automator</h1><p>Prompt → Ollama → voice → video</p><textarea id="topic" placeholder="Example: 5 free AI tools engineering students should know"></textarea><div style="display:flex;gap:10px;margin-top:12px"><select id="duration"><option>30</option><option selected>45</option><option>60</option></select><button id="go">Generate Short</button></div><div id="status"></div><video id="video" controls hidden></video></main><script>const go=document.querySelector('#go'),status=document.querySelector('#status'),video=document.querySelector('#video');go.onclick=async()=>{const topic=document.querySelector('#topic').value.trim();if(!topic){status.textContent='Enter a topic first.';return}go.disabled=true;status.textContent='Generating locally with Ollama…';video.hidden=true;try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,duration:Number(document.querySelector('#duration').value)})});const d=await r.json();if(!r.ok)throw Error(d.error||'Generation failed');status.textContent='Done!\n\n'+d.script;video.src=d.video_url;video.hidden=false}catch(e){status.textContent='Error: '+e.message}finally{go.disabled=false}};</script></body></html>
